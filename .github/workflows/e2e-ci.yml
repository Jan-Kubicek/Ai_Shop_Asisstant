name: E2E

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "frontend/**"
      - "e2e/**"
      - ".github/workflows/e2e-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "frontend/**"
      - "e2e/**"
      - ".github/workflows/e2e-ci.yml"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (fake AI)
    runs-on: ubuntu-latest

    env:
      SPRING_PROFILES_ACTIVE: dev
      AI_PROVIDER_TEXT: fake
      JWT_SECRET: ci-only-secret-with-at-least-32-bytes
      MONGO_URI: mongodb://localhost:27017/shopassistant
      APP_PIPELINE_POLL_MS: "500"
      LOGIN_RATE_LIMIT_ATTEMPTS: "100"
      E2E_USER_EMAIL: admin@example.com
      E2E_USER_PASSWORD: Test12345
      E2E_ADMIN_EMAIL: admin@example.com
      E2E_ADMIN_PASSWORD: Test12345
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: Test12345

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nastavení JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Nastavení Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build backendu
        working-directory: backend
        run: mvn -B -ntp package -DskipTests

      - name: Start backendu
        working-directory: backend
        run: |
          java -jar target/shop-assistant-0.1.0-SNAPSHOT.jar --seed-admin > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "backend ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/backend.log
          exit 1

      - name: Instalace frontendu
        working-directory: frontend
        run: npm ci

      - name: Start frontendu
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173/ > /dev/null; then
              echo "frontend ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/frontend.log
          exit 1

      - name: Instalace Playwright
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: E2E testy
        working-directory: e2e
        run: npx playwright test

      - name: Uložení výsledků při chybě
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
