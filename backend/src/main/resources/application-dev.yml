spring:
  data:
    mongodb:
      uri: "${MONGO_URI:mongodb://app:app@localhost:27017/shopassistant?authSource=shopassistant}"

logging:
  level:
    cz.example.shopassistant: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # Jen pro vývoj. V produkci je nutné nastavit JWT_SECRET.
    secret: ${JWT_SECRET:vyvojove-tajemstvi-jwt-pro-localhost-nesmi-do-produkce}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
