spring:
  application:
    name: ai-shop-assistant
  profiles:
    default: dev
  data:
    mongodb:
      uri: "${MONGO_URI:mongodb://localhost:27017/shopassistant}"
      auto-index-creation: false
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_MB:8}MB
      max-request-size: ${UPLOAD_MAX_MB:8}MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:14}
    cookie-secure: ${JWT_COOKIE_SECURE:false}
  seed-admin:
    email: ${SEED_ADMIN_EMAIL:}
    password: ${SEED_ADMIN_PASSWORD:}
  storage:
    type: ${STORAGE_TYPE:local}
    local-path: ${STORAGE_LOCAL_PATH:./data/uploads}
  upload:
    max-mb: ${UPLOAD_MAX_MB:8}
  ai:
    text-provider: ${AI_PROVIDER_TEXT:gemini}
    image-provider: ${AI_PROVIDER_IMAGE:gemini}
    gemini-api-key: ${GEMINI_API_KEY:}
    openai-api-key: ${OPENAI_API_KEY:}
    timeout-seconds: ${AI_REQUEST_TIMEOUT_SECONDS:60}
  limits:
    requests-per-day: ${LIMIT_REQUESTS_PER_DAY:20}
    model-photos-per-day: ${LIMIT_MODEL_PHOTOS_PER_DAY:3}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
