spring:
  application:
    name: ai-shop-assistant
  profiles:
    default: dev
  data:
    mongodb:
      uri: "${MONGO_URI:mongodb://localhost:27017/shopassistant}"
      auto-index-creation: false
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_MB:8}MB
      max-request-size: ${UPLOAD_MAX_MB:8}MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:14}
    cookie-secure: ${JWT_COOKIE_SECURE:false}
  seed-admin:
    email: ${SEED_ADMIN_EMAIL:}
    password: ${SEED_ADMIN_PASSWORD:}
  auth:
    login-rate-limit:
      attempts: ${LOGIN_RATE_LIMIT_ATTEMPTS:10}
      window-minutes: ${LOGIN_RATE_LIMIT_WINDOW_MINUTES:5}
  pipeline:
    enabled: ${PIPELINE_ENABLED:true}
    poll-ms: ${PIPELINE_POLL_MS:2000}
  storage:
    type: ${STORAGE_TYPE:local}
    local-path: ${STORAGE_LOCAL_PATH:./data/uploads}
  upload:
    max-mb: ${UPLOAD_MAX_MB:8}
  ai:
    text-provider: ${AI_PROVIDER_TEXT:gemini}
    image-provider: ${AI_PROVIDER_IMAGE:fake}
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${AI_MODEL_TEXT:gemini-3.1-flash-lite}
    gemini-base-url: ${AI_BASE_URL:https://generativelanguage.googleapis.com}
    openai-api-key: ${OPENAI_API_KEY:}
    openai-model: ${OPENAI_MODEL:gpt-4.1-mini}
    openai-base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    openai-image-model: ${OPENAI_IMAGE_MODEL:gpt-image-1.5}
    gemini-image-model: ${AI_GEMINI_IMAGE_MODEL:gemini-2.5-flash-image}
    timeout-seconds: ${AI_REQUEST_TIMEOUT_SECONDS:60}
    max-retries: ${AI_MAX_RETRIES:3}
    rate-limit:
      attempts: ${AI_RATE_LIMIT_ATTEMPTS:20}
      window-minutes: ${AI_RATE_LIMIT_WINDOW_MINUTES:5}
    temperature: ${AI_TEMPERATURE:0.7}
    max-tokens: ${AI_MAX_TOKENS:2048}
    cost:
      input-usd-per-million: ${AI_COST_INPUT_USD_PER_M:0.30}
      output-usd-per-million: ${AI_COST_OUTPUT_USD_PER_M:2.50}
  limits:
    requests-per-day: ${LIMIT_REQUESTS_PER_DAY:20}
    model-photos-per-day: ${LIMIT_MODEL_PHOTOS_PER_DAY:3}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
