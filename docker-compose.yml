name: ai-shop-assistant

services:
  mongo:
    image: mongo:4.4
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: $MONGO_INITDB_ROOT_USERNAME
      MONGO_INITDB_ROOT_PASSWORD: $MONGO_INITDB_ROOT_PASSWORD
      MONGO_INITDB_DATABASE: shopassistant
      MONGO_DATABASE: shopassistant
      MONGO_APP_USER: $MONGO_APP_USER
      MONGO_APP_PASSWORD: $MONGO_APP_PASSWORD
    volumes:
      - ./data/mongo:/data/db
      - ./infra/mongo/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MONGO_URI: mongodb://$MONGO_APP_USER:$MONGO_APP_PASSWORD@mongo:27017/shopassistant?authSource=shopassistant
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
    env_file:
      - .env
      STORAGE_LOCAL_PATH: /data/uploads
    volumes:
      - ./data/uploads:/data/uploads
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - internal
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - internal
    expose:
      - "80"
    ports:
      # Přímý přístup na FE na hostu. Lze změnit na 8085, nebo omezit na 127.0.0.1:5173.
      - "${FRONTEND_PORT:-5173}:80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      APP_DOMAIN: $APP_DOMAIN
      ACME_EMAIL: $ACME_EMAIL
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-$APP_DOMAIN}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - internal

volumes:
  caddy_data:
  caddy_config:

networks:
  internal:
