name: ai-shop-assistant-dev

# Vývojové závislosti. Backend a frontend spouštějte lokálně kvůli hot reloadu:
#   cd backend && mvn spring-boot:run
#   cd frontend && npm run dev
#
# Mongo Express (volitelně):
#   docker compose -f docker-compose.dev.yml --profile tools up -d mongo-express

services:
  mongo:
    image: mongo:4.4
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-root}
      MONGO_INITDB_DATABASE: shopassistant
      MONGO_DATABASE: shopassistant
      MONGO_APP_USER: ${MONGO_APP_USER:-app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-app}
    volumes:
      - ./data/mongo-dev:/data/db
      - ./infra/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo-express:
    image: mongo-express:1.0.2
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-root}:${MONGO_INITDB_ROOT_PASSWORD:-root}@mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongo:
        condition: service_healthy
